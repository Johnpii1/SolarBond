[package]
name = "solar-bond"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A transparent, token-backed solar-project bond vault for Stellar Soroban"
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = "22.0.0"

[dev-dependencies]
soroban-sdk = { version = "22.0.0", features = ["testutils"] }
